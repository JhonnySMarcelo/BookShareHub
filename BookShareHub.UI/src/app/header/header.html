<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <a routerLink="/books">BookShareHub</a>
    </div>

    <nav>
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a [routerLink]="item.route">
            {{ item.label }}
          </a>
        }

        @if (item.action) {
          <a (click)="item.action()">
            {{ item.label }}
          </a>
        }
      }
    </nav>
  </div>
</header>
